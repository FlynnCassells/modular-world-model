[project]
name = "modular-world-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "mujoco>=3.17.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "wandb>=0.31.0",
]

[project.scripts]
modular-world-model = "modular_world_model:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
